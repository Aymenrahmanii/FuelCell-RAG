# Public documents for the corpus. scripts/download_corpus.py fetches each entry into data/raw/.
# The repo ships this manifest, never the PDFs themselves.
#
# Fields:
#   id         stable slug, used as doc_id
#   url        direct link to the PDF
#   title      document title
#   publisher  organisation that publishes the document
#   year       publication year
#   licence    how the document may be used; record it exactly
#   doc_type   report | datasheet | drawing  (fcrag.models.DocType)
#   format     record | report | presentation | paper | fact_sheet  (drives parser settings)
#   topics     free tags, used to check corpus coverage
#
# Checksums live in data/sources.lock.yaml, written on first download and verified after.
#
# Licence notes:
# - "US Government work": written by federal staff (DOE program records, DOE plans and plenaries).
#   Not subject to copyright in the US.
# - DOE Annual Merit Review (AMR) presentations and NREL reports are written by national labs or
#   contractors under DOE funding and released publicly. The authors' organisations keep their
#   copyright; we use them for research only and never redistribute them.
# - NREL was renamed National Laboratory of the Rockies in 2025; its reports moved to docs.nlr.gov.
# - MDPI's site blocks scripted downloads, so open-access MDPI papers are taken from the authors'
#   institutional repository copies.
#
# All files have a text layer (verified 2026-10-25). Scanned-page test material is produced by the
# data generator, by rasterising known pages, so OCR output can be checked against the original.

