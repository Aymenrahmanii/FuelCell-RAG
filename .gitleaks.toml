# Default gitleaks rules, plus one allowlist: lower-case identifiers made of words joined by
# "_" or "-", such as "h2_consumption_rated_per_module" (parameter keys) or
# "hf-bge-m3-reranker-v2-m3" (a CI cache key). They trip the generic-api-key rule but are
# never secrets.
[extend]
useDefault = true

[allowlist]
description = "snake_case and kebab-case identifiers"
regexes = ['''^[a-z][a-z0-9]*([_-][a-z0-9]+)+$''']
