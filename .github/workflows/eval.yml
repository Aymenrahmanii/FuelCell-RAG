name: Eval gate

# Retrieval quality gate: ingest the generated corpus (Excel, requirements, STEP, drawings; no
# Docling PDF parsing on CPU), run the matching golden questions, fail on regression
# (eval/gate.yaml).
on:
  pull_request:
  push:
    branches: [main]
    paths: ["src/**", "eval/**", "data_gen/**", "prompts/**", "uv.lock", ".github/workflows/eval.yml"]
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    runs-on: ubuntu-latest
    # About 1 min per question on the CPU runner, almost all of it reranking; the run on
    # 2026-10-29 took 59.7 min of the former 60. rerank_p50_s and candidate_chars_p50 in the
    # printed summary show where the time goes.
    timeout-minutes: 90
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcrag
          POSTGRES_PASSWORD: fcrag
          POSTGRES_DB: fcrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcrag" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      FCRAG_ENV: ci
      FCRAG_POSTGRES_DSN: postgresql+psycopg://fcrag:fcrag@localhost:5432/fcrag
      FCRAG_QDRANT_URL: http://localhost:6333
      FCRAG_SOURCE_DIRS: '["data/generated"]'
      FCRAG_EMBEDDING_BATCH_SIZE: "8"
      # CI reranks the best 20 hybrid-search candidates instead of 50: reranking is ~99 % of
      # CI time and grows with candidate text. On the 40 gate questions (2026-10-30) recall@5
      # 1.00 and MRR 0.951 were identical at 50, 30 and 20. Production keeps 50.
      FCRAG_PREFETCH_LIMIT: "20"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-reranker-v2-m3

      - name: Install (CPU torch)
        run: uv sync --locked --extra ml --extra cad

      # Each step reports its error as an annotation, readable without opening the logs.
      - name: Migrate
        run: |
          uv run fcrag db-upgrade 2> err.log || {
            echo "::error title=migrate::$(tail -c 800 err.log | tr '\n' ' ')"; exit 1; }

      - name: Generate corpus
        run: |
          uv run fcrag generate 2> err.log || {
            echo "::error title=generate::$(tail -c 800 err.log | tr '\n' ' ')"; exit 1; }

      - name: Ingest
        run: |
          uv run fcrag ingest --only "ps-*" --only "req-*" --only "cad-*" --only "dwg-*" 2> err.log || {
            echo "::error title=ingest::$(grep -v '%|' err.log | tail -c 900 | tr '\n' ' ')"; exit 1; }

      - name: Evaluate and gate
        run: |
          uv run fcrag eval --name ci --gate eval/gate.yaml 2> err.log || {
            echo "::error title=eval::$(grep -v '%|' err.log | tail -c 900 | tr '\n' ' ')"; exit 1; }

      - name: Upload run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: eval/runs/*.json
