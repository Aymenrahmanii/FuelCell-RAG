name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # The ml extra (torch, Docling, FlagEmbedding) is left out: unit tests use fakes
        run: uv sync --locked --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml -m "not integration"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    # Known vulnerabilities in the locked dependencies. Accepted ones are listed, with their
    # reason, in .github/pip-audit-ignore.txt; anything else fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Export the locked dependency set
        run: uv export --locked --no-hashes --all-extras --format requirements-txt -o requirements.txt

      - name: pip-audit
        run: |
          ignores=$(grep -v '^\s*#' .github/pip-audit-ignore.txt | awk 'NF {print "--ignore-vuln " $1}')
          # --no-deps: the export is already the complete, resolved set
          uvx pip-audit==2.10.1 -r requirements.txt --no-deps --disable-pip \
            --progress-spinner off $ignores
