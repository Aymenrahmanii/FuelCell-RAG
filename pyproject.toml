[project]
name = "fcrag"
version = "0.1.0"
description = "Production-grade RAG over fuel cell engineering documents with traceable citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aymen Rahmani" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pint>=0.24",
    "qdrant-client>=1.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "litellm>=1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "lingua-language-detector>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "langfuse>=3",
]

[project.optional-dependencies]
# Heavy model dependencies: parsing, embedding, reranking. Not needed for unit tests or CI.
ml = [
    "docling>=2.60",
    "flagembedding>=1.3",
    "torch>=2.9",
]
ui = [
    "streamlit>=1.40",
]

[project.scripts]
fcrag = "fcrag.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "types-openpyxl>=3.1",
    "types-defusedxml>=0.7",
    # Synthetic corpus generator (fcrag generate)
    "reportlab>=4.2",
    "types-reportlab>=4.2",
]

[tool.uv]
# CUDA build on Windows dev machines, CPU build on Linux (CI, containers)
sources.torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "TCH"]
# En dashes are deliberate typography in generated engineering documents
# The number parser must recognise minus signs and no-break spaces in answers
allowed-confusables = ["–", "−", " ", " "]

[tool.ruff.lint.per-file-ignores]
# Question tables read better unwrapped
"src/fcrag/eval/golden.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pint.*", "FlagEmbedding.*", "lingua.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docling_core re-exports its document model from docling_core.types.doc without __all__
module = ["docling_core.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# The ml extra is not installed in CI; locally these are type-checked normally
module = ["torch.*", "docling.*", "docling_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose stack running",
]

[tool.coverage.run]
source = ["fcrag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
